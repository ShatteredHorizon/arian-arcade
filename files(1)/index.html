<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arian's ARCADE — Language</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0c0c0e;
    --surface:      #111115;
    --surface2:     #18181f;
    --border:       #252530;
    --border-hover: #3a3a50;
    --accent:       #e8c84a;
    --accent-dim:   rgba(232,200,74,0.12);
    --text-primary: #f0f0f5;
    --text-secondary:#7a7a90;
    --text-muted:   #40404e;
    --radius:       8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow */
  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(232,200,74,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: pulseGlow 4s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
  }

  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    animation: sceneIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes sceneIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    animation: fadeIn 0.6s 0.1s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(64px, 14vw, 130px);
    letter-spacing: 4px;
    line-height: 0.9;
    color: var(--text-primary);
    margin-bottom: 8px;
    animation: fadeIn 0.6s 0.15s ease both;
  }

  .logo span { color: var(--accent); }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--border-hover);
    margin: 24px auto 28px;
    animation: dividerIn 0.5s 0.3s ease both;
  }

  @keyframes dividerIn {
    from { width: 0; opacity: 0; }
    to   { width: 48px; opacity: 1; }
  }

  .prompt {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 32px;
    animation: fadeIn 0.6s 0.35s ease both;
  }

  .lang-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.6s 0.45s ease both;
  }

  .lang-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 20px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text-primary);
    transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s, background 0.25s;
    overflow: hidden;
  }

  .lang-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(232,200,74,0.08) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .lang-btn:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px var(--accent), 0 0 40px rgba(232,200,74,0.08);
    background: var(--surface2);
  }

  .lang-btn:hover::before { opacity: 1; }

  .lang-btn:active { transform: translateY(-1px); }

  .lang-flag {
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    transition: transform 0.25s;
  }

  .lang-btn:hover .lang-flag { transform: scale(1.1); }

  .lang-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--text-primary);
  }

  .lang-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .lang-arrow {
    position: absolute;
    bottom: 12px;
    right: 14px;
    color: var(--accent);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s, transform 0.2s;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
  }

  .lang-btn:hover .lang-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  .made-by {
    margin-top: 40px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    animation: fadeIn 0.6s 0.6s ease both;
  }

  .made-by span { color: var(--accent); }

  /* Scanline effect on cards */
  .lang-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,200,74,0.4), transparent);
    opacity: 0;
    transform: translateY(0);
    transition: opacity 0.3s;
  }

  .lang-btn:hover::after { opacity: 1; }

  @media (max-width: 480px) {
    .lang-grid { max-width: 320px; gap: 12px; }
    .lang-btn  { padding: 22px 16px; }
    .lang-flag { font-size: 32px; }
    .lang-name { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="eyebrow">// Language Select</div>
  <div class="logo">Arian's <span>ARCADE</span></div>

  <div class="divider"></div>

  <div class="prompt">Choose your language</div>

  <div class="lang-grid">
    <a class="lang-btn" href="de.html">
      <div class="lang-flag">🇩🇪</div>
      <div class="lang-name">Deutsch</div>
      <div class="lang-sub">German</div>
      <div class="lang-arrow">→</div>
    </a>
    <a class="lang-btn" href="en.html">
      <div class="lang-flag">🇬🇧</div>
      <div class="lang-name">English</div>
      <div class="lang-sub">Englisch</div>
      <div class="lang-arrow">→</div>
    </a>
  </div>

  <div class="made-by">Made by <span>Arian</span></div>
</div>

</body>
</html>
